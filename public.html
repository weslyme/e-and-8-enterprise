<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Request a Quote | E &amp; 8 Enterprise</title>
  <meta name="description" content="Request a quote from E &amp; 8 Enterprise in Carmen, Davao del Norte for electrical, lubrication, and industrial supply needs.">
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Request a Quote | E &amp; 8 Enterprise">
  <meta property="og:description" content="Tell us what electrical, lubrication, or industrial supplies you need and our team will get back to you with a quote.">
  <meta property="og:locale" content="en_PH">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    .form-status { display: none; padding: 12px; margin-top: 15px; border-radius: 6px; font-weight: 500; }
    .form-status.show { display: block; }
    .form-status.success { background: #e6f6e6; color: #2e8b1e; border: 1px solid #cceccc; }
    .form-status.error { background: #fdf0f0; color: #d32f2f; border: 1px solid #fadcdc; }
    .contact { display: grid; grid-template-columns: 1fr 1.3fr; gap: 40px; align-items: start; }
    @media (max-width: 900px) { .contact { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>

  <!-- NAV -->
  <div class="nav-wrap" id="navWrap">
    <nav class="nav">
      <a href="index.html" class="logo" aria-label="E &amp; 8 Enterprise home">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2e8b1e"/>
              <stop offset="55%" stop-color="#1f7a8c"/>
              <stop offset="100%" stop-color="#1f5fd1"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="30" r="22" fill="url(#logoGrad)"/>
          <ellipse cx="32" cy="30" rx="10" ry="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-opacity=".65"/>
          <path d="M10 30h44M14 20q18 4 36 0M14 40q18-4 36 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-opacity=".65"/>
          <path d="M7 40c8 10 34 12 50-4" fill="none" stroke="#3fa52a" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span><b>E &amp; 8</b><small>ENTERPRISE</small></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#products">Products</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <a href="#quoteForm" class="btn btn-primary nav-cta magnetic" style="padding:11px 22px">Request Quote</a>
    </nav>
  </div>

  <!-- QUOTE REQUEST PAGE -->
  <main style="padding-top: 40px;">
    <section class="section" id="quote-request">
      <div class="container">
        <div class="head reveal">
          <a href="index.html" class="pill" style="margin-bottom: 18px;"><span class="dot"></span>← Back to Home</a>
          <br>
          <span class="eyebrow">Request a Quote</span>
          <h1>Tell us about <span class="grad-text">your supply needs.</span></h1>
        </div>

        <div class="contact">
          <div class="info">
            <div class="card reveal" style="margin-bottom: 20px;">
              <div><h4>Main Office</h4><p>JJAS Bldg., Santan St., Purok 7, Poblacion Ising, Carmen, Davao del Norte, 8101</p></div>
            </div>
            <div class="card reveal" style="margin-bottom: 20px;">
              <div><h4>Mobile</h4><p><a href="tel:+639178995891">0917 899 5891</a></p></div>
            </div>
            <div class="card reveal">
              <div><h4>Email</h4><p><a href="mailto:e8enterprise@gmail.com">e8enterprise@gmail.com</a></p></div>
            </div>
          </div>

          <form class="card reveal" id="quoteForm">
            <!-- Web3Forms Access Key -->
            <input type="hidden" name="access_key" value="77f35ddc-5592-46ef-8d63-d40c56bdd4ff">
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <div class="row">
              <div class="field"><input id="name" name="name" required placeholder=" "><label for="name">Full name</label></div>
              <div class="field"><input id="company" name="company" placeholder=" "><label for="company">Company</label></div>
            </div>
            <div class="row">
              <div class="field"><input id="email" name="email" type="email" required placeholder=" "><label for="email">Email</label></div>
              <div class="field"><input id="phone" name="phone" type="tel" placeholder=" "><label for="phone">Phone</label></div>
            </div>
            <div class="field">
              <select id="interest" name="interest">
                <option>Electrical Products &amp; Services</option>
                <option>Lubrication</option>
                <option>Industrial Consumables</option>
                <option>Other / General Inquiry</option>
              </select>
              <label for="interest">I'm interested in</label>
            </div>
            <div class="field"><textarea id="msg" name="message" required placeholder=" "></textarea><label for="msg">Products, quantities or details you need</label></div>
            
            <button type="submit" class="btn btn-primary magnetic" style="margin-top: 15px;">Send Inquiry <span class="arrow">→</span></button>
            <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const oldForm = document.getElementById('quoteForm');
      const formStatus = document.getElementById('formStatus');
      
      if (oldForm) {
        const newForm = oldForm.cloneNode(true);
        oldForm.parentNode.replaceChild(newForm, oldForm);
        
        newForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = newForm.querySelector('button[type="submit"]');
          const statusDiv = newForm.querySelector('#formStatus');
          
          const originalText = submitBtn.innerHTML;
          submitBtn.innerHTML = 'Sending...';
          submitBtn.disabled = true;
          statusDiv.classList.remove('show', 'success', 'error');

          try {
            const formData = new FormData(newForm);
            const response = await fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              body: formData
            });
            const data = await response.json();

            if (data.success) {
              statusDiv.innerHTML = '<strong>Success!</strong> Thank you for your inquiry. Our team will get back to you shortly.';
              statusDiv.classList.add('show', 'success');
              newForm.reset();
            } else {
              statusDiv.innerHTML = '<strong>Error:</strong> ' + (data.message || 'Something went wrong. Please try again.');
              statusDiv.classList.add('show', 'error');
            }
          } catch (error) {
            statusDiv.innerHTML = '<strong>Network Error:</strong> Please check your connection and try again.';
            statusDiv.classList.add('show', 'error');
          } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
          }
        });
      }
    });
  </script>
</body>
</html>
